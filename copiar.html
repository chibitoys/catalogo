<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Copiar texto</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#14213d;--soft:#5b6785;--line:#dde3f1;--blue:#2e6fe4;--ok:#1f9d57}
@media (prefers-color-scheme:dark){:root{--bg:#0d1730;--card:#152040;--ink:#eaf1ff;--soft:#9fb0d8;--line:#29365e;--blue:#6c9bff;--ok:#57da92}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:20px}
main{width:min(640px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
#estado{font-weight:700;font-size:18px}.ok{color:var(--ok)}
pre{margin:0;white-space:pre-wrap;font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:55vh;overflow:auto}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px;background:var(--blue);color:#fff;cursor:pointer}
small{color:var(--soft)}
</style></head><body>
<main>
  <div id="estado">Preparando…</div>
  <pre id="texto"></pre>
  <button id="botao" type="button">Copiar de novo</button>
  <small>O texto vem do link (fica só no seu navegador) e nada é guardado aqui. Pode fechar a aba (Ctrl+W) e colar.</small>
</main>
<script>
// O texto vem depois do "#" do link; as quebras de linha chegam como "~~" (links nao aceitam quebra de linha).
let bruto = location.hash.slice(1);
let texto;
try { texto = decodeURIComponent(bruto); } catch (e) { texto = bruto; }
texto = texto.replace(/~~/g, "\n");
const estado = document.getElementById("estado");
document.getElementById("texto").textContent = texto || "(link sem texto)";
async function copia() {
  try { await navigator.clipboard.writeText(texto); return true; }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = texto; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {} ta.remove(); return ok;
  }
}
async function tenta(manual) {
  if (!texto) { estado.textContent = "Link sem texto."; return; }
  const ok = await copia();
  estado.textContent = ok ? "Copiado ✓ — é só colar" : "Clique no botão para copiar";
  estado.className = ok ? "ok" : "";
}
document.getElementById("botao").onclick = () => tenta(true);
tenta(false);
</script></body></html>
